name: Card catalog

on:
  push:
  pull_request:

jobs:
  card-catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate card catalog and manifest
        run: node tests/card-audit.mjs
      - name: Verify installed-app build matches its assets
        run: node scripts/build-pwa.mjs --check
