name: Rules and combat

on:
  push:
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (version pinned in package.json)
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run rules and combat tests
        run: node --test tests/rules.test.mjs tests/combat.test.mjs
