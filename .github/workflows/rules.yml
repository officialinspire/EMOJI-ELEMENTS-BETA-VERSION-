name: Rules, combat, progression, effects and AI

on:
  push:
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (version pinned in package.json)
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run rules, combat, progression, collection, effects and AI tests
        run: node --test tests/rules.test.mjs tests/combat.test.mjs tests/progression.test.mjs tests/collection.test.mjs tests/effects.test.mjs tests/ai.test.mjs tests/feedback.test.mjs tests/packs.test.mjs
