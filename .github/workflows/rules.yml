name: Rules, combat, progression, effects and AI

on:
  push:
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright (version pinned in package.json)
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run catalog and all browser logic suites
        run: npm run verify -- --group=logic
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: logic-verification
          path: test-results/verification/logic/
          retention-days: 14
