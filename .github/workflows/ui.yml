name: UI audit (phone, tablet, desktop)

on:
  push:
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and axe-core (versions pinned in package.json)
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run themes, UI, menu and card presentation audits
        run: npm run verify -- --group=visual
      - name: Upload audit results and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-verification
          path: test-results/
          retention-days: 14
