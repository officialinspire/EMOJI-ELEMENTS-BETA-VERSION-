name: UI audit (phone, tablet, desktop)

on:
  push:
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and axe-core (versions pinned in package.json)
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the UI audit
        run: node tests/ui-audit.mjs --label=ci
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-screenshots
          path: test-results/ui/ci/
          retention-days: 14
